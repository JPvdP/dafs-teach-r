          .check(identical(first_quarter, c(80, 65, 70)), "first_quarter should be monthly_rainfall[1:3]")
          .check(identical(last_quarter, c(60, 75, 90)), "last_quarter should be tail(monthly_rainfall, 3)")
          .check(identical(wet_months, c(80, 70, 75, 90)), "wet_months should be the totals of 70 mm or more (use >=)")
          .check(identical(rainfall_range, 70), "rainfall_range should be max(monthly_rainfall) - min(monthly_rainfall)")
        description: "first_quarter, last_quarter, wet_months and rainfall_range should be correct"
    hints:
      - "first_quarter <- monthly_rainfall[1:3] and last_quarter <- tail(monthly_rainfall, 3)"
      - "wet_months <- monthly_rainfall[monthly_rainfall >= 70]"
      - "rainfall_range <- max(monthly_rainfall) - min(monthly_rainfall)"
      - "cat(\"Sorted:\", sort(monthly_rainfall, decreasing = TRUE), \"\\n\")"
    solution: |
      monthly_rainfall <- c(80, 65, 70, 55, 40, 30, 20, 25, 45, 60, 75, 90)

      first_quarter <- monthly_rainfall[1:3]
      cat("First quarter:", first_quarter, "\n")

      last_quarter <- tail(monthly_rainfall, 3)
      cat("Last quarter:", last_quarter, "\n")

      wet_months <- monthly_rainfall[monthly_rainfall >= 70]
      cat("Wet months:", wet_months, "\n")

      rainfall_range <- max(monthly_rainfall) - min(monthly_rainfall)
      cat("Range:", rainfall_range, "\n")

      cat("Sorted:", sort(monthly_rainfall, decreasing = TRUE), "\n")
