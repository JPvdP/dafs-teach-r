  - id: practice_export_csv
    title: "Practice: Exporting Data to CSV"
    instructions: |
      More practice adding a computed column and exporting the result — this time water usage.

      **Your task:**
      1. Add a column `water_per_capita` (`water_liters / population`) to `df`
      2. Export `df` to `output_water.csv`
      3. Read the file back into `df_check` and print its size with `dim()`
    starter_code: |
      library(tidyverse)

      df <- tibble(
        country = c("NL", "DE", "FR"),
        population = c(17, 84, 68),
        water_liters = c(500, 2000, 1400)
      )

      # 1. Add the water_per_capita column


      # 2. Export to output_water.csv


      # 3. Read it back and print the size

    tests:
      - type: output_equals
        value: "[1] 3 4"
      - type: assert
        code: |
          .df <- readr::read_csv("output_water.csv", show_col_types = FALSE)
          .check("water_per_capita" %in% names(.df), "output_water.csv should contain the column water_per_capita")
          .check(identical(dim(.df), c(3L, 4L)), "output_water.csv should have 3 rows and 4 columns")
          .check(isTRUE(all.equal(.df$water_per_capita, c(500 / 17, 2000 / 84, 1400 / 68), tolerance = 1e-6)), "water_per_capita should be water_liters / population")
        description: "output_water.csv should have 3 rows and 4 columns including water_per_capita"
    hints:
      - "df <- df |> mutate(water_per_capita = water_liters / population)"
      - "write_csv(df, \"output_water.csv\")"
      - "df_check <- read_csv(\"output_water.csv\", show_col_types = FALSE) and then print(dim(df_check))"
    solution: |
      library(tidyverse)

      df <- tibble(
        country = c("NL", "DE", "FR"),
        population = c(17, 84, 68),
        water_liters = c(500, 2000, 1400)
      )

      df <- df |> mutate(water_per_capita = water_liters / population)

      write_csv(df, "output_water.csv")

      df_check <- read_csv("output_water.csv", show_col_types = FALSE)
      print(dim(df_check))
