  - id: practice_add_column
    title: "Practice: Adding Computed Columns"
    instructions: |
      More practice with `mutate()` — this time CO₂ emissions (in Mt) and population (in millions).

      **Your task:**
      1. In one `mutate()`, add `emissions_per_capita` (`emissions / population`) **and** `above_8` (`TRUE` when `emissions_per_capita` is above 8). Store the result back in `df` and print it.
      2. `average_epc`: the average `emissions_per_capita`, rounded to 2 decimals, as a single number. Print it.
    starter_code: |
      library(tidyverse)

      df <- tibble(
        country    = c("NL", "DE", "FR"),
        population = c(17, 84, 68),
        emissions  = c(150, 680, 310)
      )

      # 1. Add emissions_per_capita and above_8


      # 2. Average emissions_per_capita, rounded to 2 decimals

    tests:
      - type: output_contains
        value: "[1] 7.16"
      - type: assert
        code: |
          .check(is.data.frame(df) && all(c("emissions_per_capita", "above_8") %in% names(df)), "df should have the new columns emissions_per_capita and above_8")
          .check(isTRUE(all.equal(df$emissions_per_capita, c(150 / 17, 680 / 84, 310 / 68))), "emissions_per_capita should be emissions / population")
          .check(identical(df$above_8, c(TRUE, TRUE, FALSE)), "above_8 should be TRUE when emissions_per_capita is above 8")
          .check(is.numeric(average_epc) && length(average_epc) == 1 && isTRUE(all.equal(average_epc, 7.16)), "average_epc should be a single number, rounded to 2 decimals")
        description: "emissions_per_capita and above_8 added; average_epc = 7.16"
    hints:
      - "df <- df |> mutate(emissions_per_capita = emissions / population, above_8 = emissions_per_capita > 8)"
      - "average_epc <- df |> summarise(avg = round(mean(emissions_per_capita), 2)) |> pull()"
    solution: |
      library(tidyverse)

      df <- tibble(
        country    = c("NL", "DE", "FR"),
        population = c(17, 84, 68),
        emissions  = c(150, 680, 310)
      )

      df <- df |>
        mutate(
          emissions_per_capita = emissions / population,
          above_8 = emissions_per_capita > 8
        )
      print(df)

      average_epc <- df |> summarise(avg = round(mean(emissions_per_capita), 2)) |> pull()
      print(average_epc)

