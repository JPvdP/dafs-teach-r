  - id: practice_temperature_advice
    title: "Practice: if_else() and case_when() — Air Quality"
    instructions: |
      More practice with decisions for a whole column — this time air quality measurements from five cities.

      **Your task:**
      1. Add a column `alert` with `if_else()`: `TRUE` when `aqi` is 100 or more, `FALSE` otherwise. (Tip: the condition `aqi >= 100` itself is already `TRUE` or `FALSE`, so `alert = aqi >= 100` gives the same result. Use `if_else()` anyway for practice.)
      2. Add a column `advice` with `case_when()`:

      | AQI | Advice |
      |-----|--------|
      | ≥ 300 | `"Hazardous: stay indoors."` |
      | ≥ 200 | `"Very unhealthy: limit outdoor activity."` |
      | ≥ 100 | `"Unhealthy for sensitive groups."` |
      | ≥ 50 | `"Moderate: acceptable air quality."` |
      | below 50 | `"Good air quality: enjoy the outdoors."` |

      Store the result back in `air` and print it with `print(air, n = Inf, width = Inf)`.
    starter_code: |
      library(tidyverse)

      air <- tibble(
        city = c("Delhi", "Lahore", "Beijing", "Utrecht", "Reykjavik"),
        aqi  = c(350, 220, 150, 80, 30)
      )

      # add the columns alert and advice

    tests:
      - type: output_contains
        value: "Unhealthy for sensitive groups."
      - type: assert
        code: |
          .check(is.data.frame(air) && all(c("alert", "advice") %in% names(air)), "air should have the columns alert and advice: air <- air |> mutate(...)")
          .check(identical(air$alert, c(TRUE, TRUE, TRUE, FALSE, FALSE)), "alert should be TRUE for an AQI of 100 or more, and FALSE otherwise")
          .check(identical(air$advice, c("Hazardous: stay indoors.", "Very unhealthy: limit outdoor activity.", "Unhealthy for sensitive groups.", "Moderate: acceptable air quality.", "Good air quality: enjoy the outdoors.")), "the advice column doesn't match the table yet")
        description: "the alert and advice columns should match the task"
    hints:
      - "air <- air |> mutate(alert = ..., advice = case_when(...))"
      - "alert = if_else(aqi >= 100, TRUE, FALSE)"
      - "Start the case_when with aqi >= 300 ~ \"Hazardous: stay indoors.\", and end it with .default = \"Good air quality: enjoy the outdoors.\""
    solution: |
      library(tidyverse)

      air <- tibble(
        city = c("Delhi", "Lahore", "Beijing", "Utrecht", "Reykjavik"),
        aqi  = c(350, 220, 150, 80, 30)
      )

      air <- air |>
        mutate(
          alert = if_else(aqi >= 100, TRUE, FALSE),
          advice = case_when(
            aqi >= 300 ~ "Hazardous: stay indoors.",
            aqi >= 200 ~ "Very unhealthy: limit outdoor activity.",
            aqi >= 100 ~ "Unhealthy for sensitive groups.",
            aqi >= 50  ~ "Moderate: acceptable air quality.",
            .default = "Good air quality: enjoy the outdoors."
          )
        )

      print(air, n = Inf, width = Inf)
