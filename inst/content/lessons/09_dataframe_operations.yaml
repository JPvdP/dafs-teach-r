  - id: practice_merge_dataframes
    title: "Practice: Joining Data Frames"
    instructions: |
      More practice with joins — this time the other way around: the **main** table has a country that's missing from the second one.

      **Your task:**
      1. Join `df_emissions` and `df_area` on `country` so that **all four** countries of `df_emissions` are kept. Store it in `merged`.
      2. Add `emissions_per_area` (`emissions / area_km2`) to `merged`, and print `merged`. What happens to PL?
      3. `highest`: the country with the highest `emissions_per_area`, as text, using `slice_max()` and `pull()`. Print it.
    starter_code: |
      library(tidyverse)

      df_emissions <- tibble(
        country   = c("NL", "DE", "FR", "PL"),
        emissions = c(150, 680, 310, 390)
      )

      df_area <- tibble(
        country  = c("NL", "DE", "FR"),
        area_km2 = c(41850, 357580, 551695)
      )

      # 1. Join, keeping all four countries
      merged <-

      # 2. Add emissions_per_area and print merged


      # 3. The country with the highest emissions per area
      highest <-
      print(highest)
    tests:
      - type: output_contains
        value: "[1] \"NL\""
      - type: assert
        code: |
          .check(is.data.frame(merged) && nrow(merged) == 4, "merged should have all 4 countries of df_emissions: use left_join()")
          .check("emissions_per_area" %in% names(merged) && isTRUE(all.equal(merged$emissions_per_area[merged$country == "NL"], 150 / 41850)), "merged should have a column emissions_per_area = emissions / area_km2")
          .check(is.na(merged$area_km2[merged$country == "PL"]), "PL has no area in df_area, so its area_km2 should be NA")
          .check(identical(highest, "NL"), "highest should be the text \"NL\": slice_max(emissions_per_area, n = 1) |> pull(country)")
        description: "merged keeps all 4 countries (PL gets NA); NL has the highest emissions per area"
    hints:
      - "merged <- left_join(df_emissions, df_area, by = \"country\")"
      - "merged <- merged |> mutate(emissions_per_area = emissions / area_km2)"
      - "highest <- merged |> slice_max(emissions_per_area, n = 1) |> pull(country)"
    solution: |
      library(tidyverse)

      df_emissions <- tibble(
        country   = c("NL", "DE", "FR", "PL"),
        emissions = c(150, 680, 310, 390)
      )

      df_area <- tibble(
        country  = c("NL", "DE", "FR"),
        area_km2 = c(41850, 357580, 551695)
      )

      merged <- left_join(df_emissions, df_area, by = "country")

      merged <- merged |> mutate(emissions_per_area = emissions / area_km2)
      print(merged)

      highest <- merged |> slice_max(emissions_per_area, n = 1) |> pull(country)
      print(highest)

