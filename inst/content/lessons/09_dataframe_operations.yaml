    title: "Practice: Grouping and Summarising"
    instructions: |
      More practice with `group_by()`, `summarise()` and `count()` — this time per pollutant.

      **Your task:**
      1. `year_range`: per pollutant, the first and last year (columns `first` and `last`), **and** the number of readings in a column `n`, using `n()`. Print it.
      2. `counts`: the number of readings per pollutant, with `count()`. Print it.
    starter_code: |
      library(tidyverse)

      df <- tibble(
        reading_id = c("R1", "R2", "R3", "R4", "R5"),
        year       = c(2010, 2023, 2023, 2015, 2015),
        pollutant  = c("PM2.5", "PM2.5", "NO2", "PM2.5", "NO2")
      )

      # 1. First year, last year and number of readings per pollutant
      year_range <-
      print(year_range)

      # 2. Number of readings per pollutant
      counts <-
