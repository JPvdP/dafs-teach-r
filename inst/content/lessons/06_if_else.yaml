      }

  - id: practice_if_else
    title: "Practice: If / Else — Two Outcomes"
    instructions: |
      More practice with if/else — this time grading an energy efficiency audit.

      An audit `score` (out of 100) results in `"Pass"` if it's ≥ 60, and `"Fail"` otherwise.

      **Your task:**
      Write the if/else statement yourself: print `"Pass"` if the score is ≥ 60, and `"Fail"` otherwise. With `score <- 45` it should print `"Fail"`. Remember: `} else {` on one line.
    starter_code: |
      score <- 45

      # write your if/else here

    tests:
      - type: output_contains
        value: "Fail"
      - type: assert
        code: |
          .check(score == 45, "keep score <- 45")
        description: "score should be 45"
    hints:
      - "if (score >= 60) {\n  print(\"Pass\")\n}"
      - "Add } else { print(\"Fail\") } after it, with else on the same line as the }"
    solution: |
      score <- 45

      if (score >= 60) {
        print("Pass")
      } else {
        print("Fail")
      }

