        year    = c(2002, 2023, 2023, 2019, 2019),
        domain  = c("B60C", "B60C", "B29D", "C08K", "C08K")
      )

      # 1. B60C patents from 2019 onwards
      b60c_recent <-

      # 2. All patents NOT in B60C
      not_b60c <-

      print(b60c_recent)
      print(not_b60c)
    tests:
      - type: output_contains
        value: "WO2023738962"
      - type: assert
        code: |
          .check(is.data.frame(b60c_recent) && identical(b60c_recent$pat_num, "WO2023738962"), "b60c_recent should contain 1 patent: domain B60C and year 2019 or later")
          .check(is.data.frame(not_b60c) && nrow(not_b60c) == 3 && !any(not_b60c$domain == "B60C"), "not_b60c should contain the 3 patents outside domain B60C")
        description: "b60c_recent should have 1 row; not_b60c should have 3 rows"
    hints:
      - "b60c_recent <- df |> filter(domain == \"B60C\", year >= 2019)"
      - "not_b60c <- df |> filter(domain != \"B60C\")"
    solution: |
      library(tidyverse)

      df <- tibble(
        pat_num = c("WO200214562", "WO2023738962", "EP2023778962", "FR2019272698", "FR201922671"),
        year    = c(2002, 2023, 2023, 2019, 2019),
        domain  = c("B60C", "B60C", "B29D", "C08K", "C08K")
      )

      b60c_recent <- df |> filter(domain == "B60C", year >= 2019)

      not_b60c <- df |> filter(domain != "B60C")

      print(b60c_recent)
      print(not_b60c)

  - id: add_column
    title: Adding Computed Columns
    instructions: |
      You already know `mutate()` from lesson 2. Two things that make it more powerful:

      **Several columns at once**, separated by commas. And a column you just created can be used **straight away** in the next line of the same `mutate()`:

      ```r
      df |> mutate(
        revenue = price * sold,
        big_sale = revenue > 1000     # uses the revenue column from the line above
      )
      ```

      `mutate()` always calculates **row by row**: every product gets its own revenue.

      **Your task:**
      GDP is in billions, population in millions.
      1. Add `gdp_per_capita` (`gdp / population`) **and** `rich` (`TRUE` when `gdp_per_capita` is above 45) in **one** `mutate()`, and store the result back in `df`
      2. Print `df`
      3. Calculate the average `gdp_per_capita` over all countries, rounded to 2 decimals, with `summarise()` and `pull()`, and print it
    starter_code: |
      library(tidyverse)

      df <- tibble(
        country    = c("NL", "DE", "FR"),
        population = c(17, 84, 68),
        gdp        = c(1000, 4200, 2800)
      )

      # 1. Add gdp_per_capita and rich
      df <- df |>
        mutate(

        )

      # 2. Print df


      # 3. Average gdp_per_capita, rounded to 2 decimals
      average_gdp_pc <-
      print(average_gdp_pc)
    tests:
      - type: output_contains
        value: "gdp_per_capita"
      - type: output_contains
        value: "[1] 50"
      - type: assert
        code: |
          .check(is.data.frame(df) && all(c("gdp_per_capita", "rich") %in% names(df)), "df should have the new columns gdp_per_capita and rich")
          .check(isTRUE(all.equal(df$gdp_per_capita, c(1000 / 17, 4200 / 84, 2800 / 68))), "gdp_per_capita should be gdp / population")
          .check(identical(df$rich, c(TRUE, TRUE, FALSE)), "rich should be TRUE when gdp_per_capita is above 45")
          .check(is.numeric(average_gdp_pc) && length(average_gdp_pc) == 1 && isTRUE(all.equal(average_gdp_pc, 50)), "average_gdp_pc should be a single number: summarise(...) |> pull()")
        description: "gdp_per_capita and rich added; average_gdp_pc = 50"
    hints:
      - "Inside mutate(): gdp_per_capita = gdp / population, rich = gdp_per_capita > 45"
      - "print(df)"
      - "average_gdp_pc <- df |> summarise(avg = round(mean(gdp_per_capita), 2)) |> pull()"
    solution: |
      library(tidyverse)

      df <- tibble(
        country    = c("NL", "DE", "FR"),
        population = c(17, 84, 68),
        gdp        = c(1000, 4200, 2800)
      )

      df <- df |>
        mutate(
          gdp_per_capita = gdp / population,
          rich = gdp_per_capita > 45
        )

      print(df)

      average_gdp_pc <- df |> summarise(avg = round(mean(gdp_per_capita), 2)) |> pull()
      print(average_gdp_pc)

  - id: groupby_agg
    title: Grouping and Summarising
    instructions: |
      With real data we often want a summary **per group**: per year, per organisation, per region. For example: the earliest and latest patent **per domain**.

      `summarise()` alone turns the whole table into one row. Put `group_by()` before it, and you get **one row per group**:

      ```r
      df |>
        group_by(domain) |>
        summarise(first = min(year), last = max(year))
      ```
      ```
      # A tibble: 3 × 3
        domain first  last
        <chr>  <dbl> <dbl>
      1 B29D    2023  2023
      2 B60C    2002  2023
      3 C08K    2019  2019
      ```

      Read it as: "take `df`, **and then** split it into groups by domain, **and then** calculate the first and last year within each group".

      Counting the rows per group is so common that there's a shortcut, `count()`:

      ```r
      df |> count(domain)
      ```

      This does the same as `group_by(domain) |> summarise(n = n())`: `n()` is the number of rows in the group.

      **Your task:**
      1. `year_range`: per domain, the first (`min`) and last (`max`) year, in columns called `first` and `last`. Print it.
      2. `counts`: the number of patents per domain, with `count()`. Print it.
    starter_code: |
      library(tidyverse)

      df <- tibble(
        pat_num = c("WO200214562", "WO2023738962", "EP2023778962", "FR2019272698", "FR201922671"),
        year    = c(2002, 2023, 2023, 2019, 2019),
        domain  = c("B60C", "B60C", "B29D", "C08K", "C08K")
      )

      # 1. First and last year per domain
      year_range <-
      print(year_range)

      # 2. Number of patents per domain
      counts <-
      print(counts)
    tests:
      - type: output_contains
        value: "B60C"
      - type: output_contains
        value: "2002"
      - type: assert
        code: |
          .check(is.data.frame(year_range) && nrow(year_range) == 3 && all(c("domain", "first", "last") %in% names(year_range)), "year_range should have one row per domain, with the columns domain, first and last")
          .b <- year_range[year_range$domain == "B60C", ]
          .check(.b$first == 2002 && .b$last == 2023, "for B60C, first should be 2002 and last 2023")
          .check(is.data.frame(counts) && identical(counts$n, c(1L, 2L, 2L)), "counts should have the number of patents per domain: df |> count(domain)")
        description: "year_range should have 3 domains (B60C: 2002 to 2023); counts should come from count()"
    hints:
      - "year_range <- df |> group_by(domain) |> summarise(first = min(year), last = max(year))"
      - "counts <- df |> count(domain)"
    solution: |
      library(tidyverse)

      df <- tibble(
        pat_num = c("WO200214562", "WO2023738962", "EP2023778962", "FR2019272698", "FR201922671"),
        year    = c(2002, 2023, 2023, 2019, 2019),
        domain  = c("B60C", "B60C", "B29D", "C08K", "C08K")
      )

      year_range <- df |>
        group_by(domain) |>
        summarise(first = min(year), last = max(year))
      print(year_range)

      counts <- df |> count(domain)
      print(counts)

  - id: merge_dataframes
    title: Joining Data Frames
    instructions: |
      We often need to combine information from different sources. For example, we want to analyse the link between population and air pollution. We find pollution data from the WHO, but population data comes from a different source, so we end up with two tables:

      | country | pollution |    | country | population |
      |---------|-----------|----|---------|------------|
      | NL      | 21        |    | NL      | 17         |
      | DE      | 23        |    | DE      | 84         |
      | FR      | 17        |    | FR      | 68         |
      |         |           |    | BE      | 12         |

      We combine them with a **join**, matching rows on a **key** column that both tables have (`by = "country"`):

      ```r
      merged <- inner_join(df_pollution, df_population, by = "country")
      ```

      The type of join decides what happens with rows that have **no match**, like BE above:

      | Join | Keeps |
      |------|-------|
      | `inner_join(x, y)` | only rows that appear in **both** tables (BE is dropped) |
      | `left_join(x, y)` | **all** rows of `x`; missing values from `y` become `NA` |
      | `full_join(x, y)` | all rows of **both** tables |

      `left_join()` is the one you'll use most: "keep my main table, and add information from another table where it exists".

      Always check the number of rows after a join: if it's not what you expected, the key values may be written differently in the two tables (`"NL"` vs `"Netherlands"`, or `"nl"`).

      **Your task:**
      1. Join `df_pollution` and `df_population` with an **inner** join on `country`, and store it in `merged`
      2. Print `merged`: BE should not be in it
      3. Add the column `pollution_per_capita` (`pollution / population`) to `merged`

      The last lines print the country with the highest pollution per capita. (`arrange(desc(...))` sorts from high to low: more about that in the next exercise.)
    starter_code: |
      library(tidyverse)

      df_pollution <- tibble(
        country   = c("NL", "DE", "FR"),
        pollution = c(21, 23, 17)
      )

      df_population <- tibble(
        country    = c("NL", "DE", "FR", "BE"),
        population = c(17, 84, 68, 12)
      )

      # 1. Join on country
      merged <-

      # 2. Print merged


      # 3. Add pollution_per_capita
      merged <- merged |> mutate()

      # The country with the highest pollution per capita
      highest <- merged |> arrange(desc(pollution_per_capita)) |> pull(country)
      print(highest[1])
    tests:
      - type: output_contains
        value: "[1] \"NL\""
      - type: assert
        code: |
          .check(is.data.frame(merged) && all(c("country", "pollution", "population") %in% names(merged)), "merged should contain the columns of both tables")
          .check(nrow(merged) == 3 && !("BE" %in% merged$country), "merged should have 3 rows: an inner join drops BE, which has no pollution data")
          .check("pollution_per_capita" %in% names(merged) && isTRUE(all.equal(merged$pollution_per_capita[merged$country == "NL"], 21 / 17)), "pollution_per_capita should be pollution / population")
        description: "merged should have 3 rows (no BE) and a pollution_per_capita column"
    hints:
      - "merged <- inner_join(df_pollution, df_population, by = \"country\")"
      - "print(merged)"
      - "merged <- merged |> mutate(pollution_per_capita = pollution / population)"
    solution: |
      library(tidyverse)

      df_pollution <- tibble(
        country   = c("NL", "DE", "FR"),
        pollution = c(21, 23, 17)
      )

      df_population <- tibble(
        country    = c("NL", "DE", "FR", "BE"),
        population = c(17, 84, 68, 12)
      )

      merged <- inner_join(df_pollution, df_population, by = "country")

      print(merged)

      merged <- merged |> mutate(pollution_per_capita = pollution / population)

      highest <- merged |> arrange(desc(pollution_per_capita)) |> pull(country)
      print(highest[1])

  - id: sort_and_rank
    title: "Sorting and Top-N Selection"
    instructions: |
      `arrange()` sorts the rows of a tibble by a column, from small to large. Wrap the column in `desc()` to sort from large to small:

      ```r
      df |> arrange(score)          # low to high
      df |> arrange(desc(score))    # high to low
      ```

      To keep only the first rows after sorting, use `slice_head()`:

      ```r
      df |> arrange(desc(score)) |> slice_head(n = 3)
      ```

      Or do both in one go with `slice_max()`: the `n` rows with the highest values.

      ```r
      df |> slice_max(score, n = 3)
      ```

      **Your task:**
      1. `df_sorted`: `df` sorted by `renewable_pct` from **high to low**. Print it.
      2. `top3`: the 3 countries with the highest `renewable_pct`. Print it.

      The last line prints the best country.
    starter_code: |
      library(tidyverse)

      df <- tibble(
        country       = c("NL", "DE", "FR", "ES", "PL", "SE", "NO"),
        renewable_pct = c(15,   40,   20,   35,    8,   65,   98),
        total_gw      = c(20,  100,   80,   60,   50,   30,   15)
      )

      # 1. Sort by renewable_pct, high to low
      df_sorted <-
      print(df_sorted)

      # 2. The top 3 countries
      top3 <-
      print(top3)

      cat("Best:", top3$country[1], "\n")
    tests:
      - type: output_contains
        value: "Best: NO"
      - type: assert
        code: |
          .check(is.data.frame(df_sorted) && nrow(df_sorted) == 7 && identical(df_sorted$country[1:3], c("NO", "SE", "DE")), "df_sorted should contain all 7 countries, from the highest renewable_pct to the lowest")
          .check(is.data.frame(top3) && identical(top3$country, c("NO", "SE", "DE")), "top3 should be NO, SE and DE, in that order")
        description: "Norway (98%) is #1, Sweden (65%) #2, Germany (40%) #3"
    hints:
      - "df_sorted <- df |> arrange(desc(renewable_pct))"
      - "top3 <- df_sorted |> slice_head(n = 3)"
    solution: |
      library(tidyverse)

      df <- tibble(
        country       = c("NL", "DE", "FR", "ES", "PL", "SE", "NO"),
        renewable_pct = c(15,   40,   20,   35,    8,   65,   98),
        total_gw      = c(20,  100,   80,   60,   50,   30,   15)
      )

      df_sorted <- df |> arrange(desc(renewable_pct))
      print(df_sorted)

      top3 <- df_sorted |> slice_head(n = 3)
      print(top3)

      cat("Best:", top3$country[1], "\n")

  - id: string_operations
    title: "Working With Text Columns"
    instructions: |
      The **stringr** package (loaded with the tidyverse) has functions for text. They all start with `str_`, so in RStudio you can type `str_` and see the whole list. They work on every value of a column at once:

      ```r
      str_to_upper(city)          # "AMSTERDAM", ...
      str_length(city)            # number of characters: 9, ...
      str_detect(city, "dam")     # TRUE if the text contains "dam"
      ```

      Like any calculation on a column, you use them inside `mutate()` or `filter()`:

      ```r
      df |> mutate(city_upper = str_to_upper(city))
      df |> filter(str_detect(city, "dam"))       # Amsterdam, Rotterdam
      ```

      **Your task:**
      1. The column `city_upper` is already added. Add `name_length` (the number of characters in `city`) in the same `mutate()`
      2. `long_names`: only the cities whose name is **longer than 5 characters**
      3. Print `df`, then `long_names`
    starter_code: |
      library(tidyverse)

      df <- tibble(
        city       = c("Oslo", "Amsterdam", "Berlin", "Madrid", "Rome", "Copenhagen"),
        population = c(700000, 900000, 3700000, 3300000, 2800000, 800000)
      )

      df <- df |>
        mutate(
          city_upper = str_to_upper(city),
          # 1. add name_length here
        )

      # 2. Cities with a name longer than 5 characters
      long_names <-

      # 3. Print df and long_names

    tests:
      - type: output_contains
        value: "COPENHAGEN"
      - type: assert
        code: |
          .check("name_length" %in% names(df) && df$name_length[df$city == "Amsterdam"] == 9, "df should have a column name_length with the number of characters: str_length(city)")
          .check(is.data.frame(long_names) && setequal(long_names$city, c("Amsterdam", "Berlin", "Madrid", "Copenhagen")), "long_names should contain Amsterdam, Berlin, Madrid and Copenhagen")
        description: "name_length correct; long_names has Amsterdam, Berlin, Madrid, Copenhagen"
    hints:
      - "name_length = str_length(city)"
      - "long_names <- df |> filter(name_length > 5)"
      - "print(df) and print(long_names)"
    solution: |
      library(tidyverse)

      df <- tibble(
        city       = c("Oslo", "Amsterdam", "Berlin", "Madrid", "Rome", "Copenhagen"),
        population = c(700000, 900000, 3700000, 3300000, 2800000, 800000)
      )

      df <- df |>
        mutate(
          city_upper = str_to_upper(city),
          name_length = str_length(city)
        )

      long_names <- df |> filter(name_length > 5)

      print(df)
      print(long_names)

