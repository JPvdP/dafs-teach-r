title: Data Frame Operations
description: Go deeper into dplyr — select columns, filter rows, add computed columns, join datasets, summarise per group, sort, and work with text columns. The core skills of data analysis in R.

exercises:

  - id: select_columns
    title: Selecting Columns
    instructions: |
      In lesson 2 you used `select()` with column names. There are more ways to tell `select()` which columns you want:

      ```r
      # By name
      df |> select(name, age)

      # By position: the first two columns
      df |> select(1:2)

      # Everything EXCEPT a column: a minus sign removes, just like with vectors
      df |> select(-gender)

      # A range of columns, from name up to and including age
      df |> select(name:age)
      ```

      Selecting by **name** is usually the best choice: if the columns in your file ever change order, `select(1:2)` silently picks the wrong ones, while `select(name, age)` still works (or gives a clear error).

      **Your task:**
      All three ways below should give the same two columns, `city` and `aqi`:
      1. `by_name`: select `city` and `aqi` by name
      2. `by_position`: select the first two columns by position
      3. `without_region`: remove the `region` column with a minus sign

      Then print `by_name`.
    starter_code: |
      library(tidyverse)

      df <- tibble(
        city   = c("Utrecht", "Amsterdam", "Rotterdam", "Groningen", "Eindhoven"),
        aqi    = c(42, 55, 38, 29, 47),
        region = c("Central", "North-Holland", "South-Holland", "North", "South")
      )

      # 1. By name
      by_name <-

      # 2. By position
      by_position <-

      # 3. Without region
      without_region <-

      print(by_name)
    tests:
      - type: output_contains
        value: "Groningen"
      - type: assert
        code: |
          .check(is.data.frame(by_name) && identical(names(by_name), c("city", "aqi")), "by_name should have the columns city and aqi: df |> select(city, aqi)")
          .check(is.data.frame(by_position) && identical(names(by_position), c("city", "aqi")), "by_position should have the first two columns: df |> select(1:2)")
          .check(is.data.frame(without_region) && identical(names(without_region), c("city", "aqi")), "without_region should have every column except region: df |> select(-region)")
        description: "by_name, by_position and without_region should all have the columns city and aqi"
    hints:
      - "by_name <- df |> select(city, aqi)"
      - "by_position <- df |> select(1:2)"
      - "without_region <- df |> select(-region)"
    solution: |
      library(tidyverse)

      df <- tibble(
        city   = c("Utrecht", "Amsterdam", "Rotterdam", "Groningen", "Eindhoven"),
        aqi    = c(42, 55, 38, 29, 47),
        region = c("Central", "North-Holland", "South-Holland", "North", "South")
      )

      by_name <- df |> select(city, aqi)

      by_position <- df |> select(1:2)

      without_region <- df |> select(-region)

      print(by_name)

  - id: filter_rows
    title: Filtering Rows
    instructions: |
      `filter()` keeps the rows where a condition is `TRUE`. To keep rows where a column **equals** a value, use a **double** `==`:

      ```r
      df |> filter(year == 2023)
      ```

      A single `=` is the most common mistake here. dplyr recognises it and tells you what to do:

      ```
      Error in filter(df, year = 2023) : We detected a named input.
      ℹ This usually means that you've used `=` instead of `==`.
      ℹ Did you mean `year == 2023`?
      ```

      Remember from lesson 1: `=` gives a value (like `<-`), `==` **asks** whether two values are equal.

      To count the rows of the result, use `nrow()`.

      **Your task:**
      1. Keep only the patents from 2023, and store them in `patents_2023`
      2. Print `patents_2023`
      3. Print the number of patents from 2023 with `nrow()`
