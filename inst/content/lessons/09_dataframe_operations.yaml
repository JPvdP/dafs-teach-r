        year    = c(2002, 2023, 2023, 2019, 2019),
        domain  = c("B60C", "B60C", "B29D", "C08K", "C08K")
      )

      # 1. Patents from 2023 only
      patents_2023 <-

      # 2. Print them


      # 3. Print how many there are

    tests:
      - type: output_contains
        value: "EP2023778962"
      - type: output_contains
        value: "[1] 2"
      - type: assert
        code: |
          .check(is.data.frame(patents_2023), "patents_2023 should be a tibble: the result of filter()")
          .check(nrow(patents_2023) == 2 && all(patents_2023$year == 2023), "patents_2023 should contain only the 2 patents from 2023")
        description: "patents_2023 should contain exactly the 2 patents from 2023"
    hints:
      - "patents_2023 <- df |> filter(year == 2023)"
      - "print(nrow(patents_2023))"
    solution: |
      library(tidyverse)

      df <- tibble(
        pat_num = c("WO200214562", "WO2023738962", "EP2023778962", "FR2019272698", "FR201922671"),
        year    = c(2002, 2023, 2023, 2019, 2019),
        domain  = c("B60C", "B60C", "B29D", "C08K", "C08K")
      )

      patents_2023 <- df |> filter(year == 2023)

      print(patents_2023)

      print(nrow(patents_2023))

  - id: filter_multiple
    title: Filtering with Multiple Conditions
    instructions: |
      You can combine conditions with the logical operators from lesson 3:

      | Operation | In `filter()` | Example |
      |-----------|---------------|---------|
      | and | `&` or a comma `,` | `filter(year >= 2019, domain == "B60C")` |
      | or | `\|` | `filter(domain == "B60C" \| domain == "B29D")` |
      | not | `!` or `!=` | `filter(domain != "B60C")` |
      | one of several values | `%in%` | `filter(domain %in% c("B60C", "B29D"))` |

      Inside `filter()`, a **comma** means "and": both conditions must be `TRUE`. `%in%` (from lesson 7) is a shorter way to write a long chain of `|`.

      **Your task:**
      1. `b60c_recent`: patents in domain `"B60C"` from 2019 or later
      2. `not_b60c`: all patents **not** in domain `"B60C"`
      3. Print both
    starter_code: |
