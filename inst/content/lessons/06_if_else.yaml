      | Recycling rate | Category |
      |-----------------|----------|
      | Less than 20 | `"Poor Recycling"` |
      | 20 to less than 50 | `"Fair Recycling"` |
      | 50 to less than 80 | `"Good Recycling"` |
      | 80 or more | `"Excellent Recycling"` |

      The last line already calls it with `65` and prints the result.
    starter_code: |
      categorize_recycling <- function(rate) {
        if (rate < 20) {
          return("Poor Recycling")
        } else if (rate < 50) {
          # Fair range

        } else if (rate < 80) {
          # Good range

        } else {
          # Excellent

        }
      }

      print(categorize_recycling(65))
    tests:
      - type: output_contains
        value: "Good Recycling"
      - type: assert
        code: |
          .check(identical(categorize_recycling(10), "Poor Recycling"), "10% should be Poor Recycling")
          .check(identical(categorize_recycling(35), "Fair Recycling"), "35% should be Fair Recycling")
          .check(identical(categorize_recycling(65), "Good Recycling"), "65% should be Good Recycling")
          .check(identical(categorize_recycling(90), "Excellent Recycling"), "90% should be Excellent Recycling")
        description: "the function should give the right category for all four ranges"
    hints:
      - "Each empty block needs a return(...) with the right category"
      - "In the Fair block: return(\"Fair Recycling\")"
      - "In the else block: return(\"Excellent Recycling\")"
    solution: |
      categorize_recycling <- function(rate) {
        if (rate < 20) {
          return("Poor Recycling")
        } else if (rate < 50) {
          return("Fair Recycling")
        } else if (rate < 80) {
          return("Good Recycling")
        } else {
          return("Excellent Recycling")
        }
      }

      print(categorize_recycling(65))

