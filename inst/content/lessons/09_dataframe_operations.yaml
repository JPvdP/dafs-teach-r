      library(tidyverse)

      df <- tibble(
        reading_id = c("R1", "R2", "R3", "R4", "R5"),
        year       = c(2010, 2023, 2023, 2015, 2015),
        pollutant  = c("PM2.5", "PM2.5", "NO2", "PM2.5", "NO2")
      )

      year_range <- df |>
        group_by(pollutant) |>
        summarise(first = min(year), last = max(year), n = n())
