  - id: practice_read_csv_separator
    title: "Practice: Semicolons and Decimal Commas"
    instructions: |
      More practice with semicolon files — this time waste data per person.

      **Your task:**
      1. Run the code first. `read_delim()` gets the columns right, but look at the `waste_kg` values: they are 10 times too large. Why?
      2. Fix it so the values are read correctly. The code prints the size of `df` and the waste of `DE`, which should be `510.5`.
    starter_code: |
      library(tidyverse)

      csv_data <- "country;waste_kg;year
      NL;450,2;2022
      DE;510,5;2022
      FR;390,8;2022"

      df <- read_delim(I(csv_data), delim = ";")

      print(dim(df))
      print(df$waste_kg[2])
    tests:
      - type: output_contains
        value: "[1] 510.5"
      - type: assert
        code: |
          .check(identical(dim(df), c(3L, 3L)), "df should have 3 rows and 3 columns")
          .check(isTRUE(all.equal(df$waste_kg, c(450.2, 510.5, 390.8))), "the waste_kg values should be 450.2, 510.5 and 390.8: the comma is the decimal mark")
        description: "df should have waste_kg values 450.2, 510.5, 390.8"
    hints:
      - "read_delim() expects a . as decimal mark, so it ignores the comma in 510,5"
      - "df <- read_csv2(I(csv_data))"
    solution: |
      library(tidyverse)

      csv_data <- "country;waste_kg;year
      NL;450,2;2022
      DE;510,5;2022
      FR;390,8;2022"

      df <- read_csv2(I(csv_data))

      print(dim(df))
      print(df$waste_kg[2])

