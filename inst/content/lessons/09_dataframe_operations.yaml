    tests:
      - type: output_contains
        value: "PM2.5"
      - type: assert
        code: |
          .check(is.data.frame(year_range) && nrow(year_range) == 2 && all(c("pollutant", "first", "last", "n") %in% names(year_range)), "year_range should have one row per pollutant, with the columns pollutant, first, last and n")
          .p <- year_range[year_range$pollutant == "PM2.5", ]
          .check(.p$first == 2010 && .p$last == 2023 && .p$n == 3, "for PM2.5, first should be 2010, last 2023 and n 3")
