# ─────────────────────────────────────────────────────────────
# Deadlines for anonymous progress reporting (same mechanism as the
# Python app, and the same DAFS_TEACH_SYNC_URL endpoint).
#
# Once a deadline passes, the next time a student opens the app it
# sends an ANONYMOUS summary of their progress on those lessons — no
# student name is ever included.
#
# The ids start with "r-" so R reports can be told apart from the
# Python track's reports in the same Google Sheet.
#
# Dates are ISO format, local time: YYYY-MM-DDTHH:MM:SS. The home
# page groups the lessons by these weeks, in deadline order, and shows
# each week's deadline. A deadline that has already passed when a
# student first opens the app is marked as "sent" without reporting
# anything.
# ─────────────────────────────────────────────────────────────

- id: r-week1
  deadline: "2026-11-25T23:59:00"
  lessons:
    - 01_r_basics
    - 02_data_frames_intro
    - 03_data_types_and_logic
    - 04_installing_packages
    - 05_print_and_functions

- id: r-week2
  deadline: "2026-12-02T23:59:00"
  lessons:
    - 06_if_else
    - 07_vectors_and_lists
    - 08_importing_data
    - 09_dataframe_operations

- id: r-week3
  deadline: "2026-12-09T23:59:00"
  lessons:
    - 10_for_loops
    - 11_while_loops
    - 12_loops_with_data
    - 13_reading_scripts
    - 14_reading_scripts_dataframes
    - 15_reading_unfamiliar_code
    - 16_exam_prep
